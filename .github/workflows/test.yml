name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm run check
      - run: npm test

  # The browser smoke test: the real page in headless Chrome (preinstalled on
  # GitHub's Ubuntu runners), failing on any script error or broken dialog.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run test:browser
        env:
          CHROME_PATH: /usr/bin/google-chrome

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t frunk:ci .
      - name: Start it and wait for the healthcheck
        run: |
          docker run -d --name frunk -e FRUNK_OWNER_EMAIL=owner@example.com frunk:ci
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' frunk)
            [ "$status" = healthy ] && exit 0
            sleep 2
          done
          docker logs frunk
          exit 1
