name: Tests and publish

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm run check
      - run: npm test

  # The browser smoke test: the real page in headless Chrome (preinstalled on
  # GitHub's Ubuntu runners), failing on any script error or broken dialog.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run test:browser
        env:
          CHROME_PATH: /usr/bin/google-chrome

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t frunk:ci .
      - name: Start it and wait for the healthcheck
        run: |
          docker run -d --name frunk -e FRUNK_OWNER_EMAIL=owner@example.com frunk:ci
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' frunk)
            [ "$status" = healthy ] && exit 0
            sleep 2
          done
          docker logs frunk
          exit 1

  # Publishes ghcr.io/<owner>/frunk once everything above passes on main, so
  # deployments pull a tested image instead of building from source.
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, browser, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
